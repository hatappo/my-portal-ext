name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          check-latest: true
          cache: npm
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`);
          JS
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run zip
      - name: Stage release archive
        run: |
          mkdir -p release
          cp extension/.output/my-portal-ext-*-chrome.zip release/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: extension
          path: release/my-portal-ext-*-chrome.zip
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: extension
          path: release
      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "release/my-portal-ext-${RELEASE_TAG#v}-chrome.zip" \
            --verify-tag --generate-notes --title "$RELEASE_TAG" --prerelease
